<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TXT Preview</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body data-theme="dark">
  <header id="app-header">
    <div id="segmented" role="tablist">
      <button class="seg active" data-tab="editor">Editor</button>
      <button class="seg" data-tab="preview">Vista previa</button>
      <button class="seg" data-tab="settings">Configuración</button>
      <button class="seg" data-tab="browser">Navegador</button>
    </div>
    <button id="theme-toggle" class="ghost">Tema: Oscuro</button>
    <span id="version-badge"></span>
  </header>

  <main id="pages">
    <section class="page active" data-page="editor">
      <div id="ai-bar">
        <button class="ghost" data-ai-action="consult" title="Ctrl+Enter">Consultar IA</button>
        <button class="ghost" data-ai-action="summarize">Resumir con IA</button>
        <button class="ghost" data-ai-action="correct">Corregir Gramática y Ortografía</button>
        <button class="ghost" data-ai-action="translate_en_es">Traducir EN→ES</button>
        <button class="ghost" data-ai-action="translate_es_en">Traducir ES→EN</button>
        <label id="web-search-label" class="ghost" title="Usar la búsqueda web si el modelo la admite">
          <input id="web-search" type="checkbox" checked /> Búsqueda web
        </label>
        <button id="attach-files" class="ghost">Adjuntar archivos</button>
        <input id="attach-input" type="file" multiple
               accept=".txt,.md,.pdf,.docx,.pptx,.png,.jpg,.jpeg,.webp,.gif" hidden />
        <button id="clear-attachments" class="ghost" hidden>Quitar adjuntos</button>
      </div>
      <div id="attachment-summary">Sin archivos adjuntos para la próxima solicitud</div>
      <div id="speech-bar">
        <button id="speech-play" class="ghost">Play</button>
        <button id="speech-pause" class="ghost">Pausar</button>
        <button id="speech-replay" class="ghost">Repetir</button>
      </div>
      <textarea id="editor" placeholder="Escribí o pegá tu texto acá..."></textarea>
    </section>

    <section class="page" data-page="preview">
      <div id="preview-bar">
        <button id="export-pdf" class="ghost">Exportar PDF</button>
        <button id="export-mp3" class="ghost">Exportar MP3</button>
        <button id="copy-md" class="ghost">Copiar Markdown</button>
        <button id="copy-txt" class="ghost">Copiar texto</button>
      </div>
      <div id="preview" class="markdown-body"></div>
    </section>

    <section class="page" data-page="settings">
      <div class="settings-form">
        <label for="api-key">API key de Groq</label>
        <input id="api-key" type="password" placeholder="gsk_..." autocomplete="off" />
        <p class="hint">Se guarda cifrada en Configuración (T10). Podés crear una gratis en console.groq.com/keys.</p>
        <label for="model-select">Modelo</label>
        <select id="model-select" disabled><option>openai/gpt-oss-120b</option></select>
        <p class="hint">T2: catálogo conectado en el siguiente paso de integración.</p>
      </div>
    </section>

    <section class="page" data-page="browser">
      <div id="browser-bar">
        <input id="browser-address" type="text" placeholder="https://..." />
        <button id="browser-go" class="ghost">Abrir</button>
      </div>
      <iframe id="browser-frame" title="Navegador"></iframe>
    </section>
  </main>

  <footer id="status-bar"><span id="status-message"></span></footer>

  <script src="js/main.js"></script>
</body>
</html>
