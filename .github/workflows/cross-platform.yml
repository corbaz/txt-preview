# T8: every push must stay Mac-compatible (S4). The doctor runs on both OSes;
# failures in the shared Python suite fail the job, doctor output is informational.
name: cross-platform

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · python tests + doctor
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt edge-tts

      - name: Run test suite (cross-platform)
        run: python -m unittest discover -s app/tests -v

      - name: Doctor report (informational)
        run: python app/doctor.py --json
        continue-on-error: true

  legacy-windows-suite:
    name: legacy PowerShell suite (windows only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip
      - name: Run legacy suite
        run: python -m unittest discover -s tests -v
